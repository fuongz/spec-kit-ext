schema_version: "1.0"

extension:
  id: teammate-sync
  name: Teammate Sync
  version: 0.1.0
  description: >
    Sync your speckit project state with teammates using portable YAML snapshots —
    no server, no daemon, no real-time sync required. Export your entire specs/
    directory into a single YAML file, share it via any method (Dropbox, email,
    file share), and teammates can import it with interactive conflict resolution.
    Includes a diff/preview command so you can inspect changes before applying them.
  author: fuongz
  repository: https://github.com/fuongz/spec-kit-ext
  homepage: https://phuongphung.com
  license: MIT

requires:
  speckit_version: ">=0.3.2"
  tools:
    - name: git
      required: false
      version: ">=2.0"

provides:
  commands:
    - name: speckit.teammate-sync.export
      file: commands/export.md
      description: >
        Export the entire specs/ directory into a portable YAML snapshot file.
        Snapshots are saved to the configured shared_sync_folder (default:
        .specify/sync/). Each file is tracked by a stable UUID so renames and
        moves are handled correctly. Supports --output to override the destination.

    - name: speckit.teammate-sync.import
      file: commands/import.md
      description: >
        Import a teammate's YAML snapshot into the local specs/ directory.
        Merges non-conflicting changes directly; presents an interactive terminal
        prompt ([L]ocal / [T]eammate / [S]kip) for each conflicting record.
        Import is atomic — a crash or interruption leaves local state unchanged.

    - name: speckit.teammate-sync.diff
      file: commands/diff.md
      description: >
        Preview what would change if a snapshot were imported, without modifying
        any local files. Shows added (+), teammate-modified (~), conflicting (!),
        and unchanged (=) records with a summary count. Safe to run at any time.

  config:
    - name: teammate-sync-config
      template: config/teammate-sync.template.yml
      description: >
        Configuration for the teammate-sync extension. Set shared_sync_folder to
        a team-accessible path (Dropbox, Google Drive, network mount, etc.) for
        zero-argument export/import workflows. Copy template to
        teammate-sync-config.yml and fill in values.
      required: false

hooks:
  after_implement:
    command: speckit.teammate-sync.export
    optional: true
    description: >
      After /speckit.implement, automatically export a snapshot to the configured
      shared_sync_folder so teammates always have access to your latest state.
      Optional — enable by setting auto_export: true in your config.

tags: [sync, team, collaboration, snapshot, yaml, productivity]
